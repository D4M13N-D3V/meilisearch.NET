name: build-packages

on:
  push:
    branches: 
      - 'master'

jobs:
  meilisearch-dotnet-packages:
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: "/home/runner"
    permissions:
      contents: write
      packages: write

    steps:
      - name: Cleanup build folder
        run: |
          rm -rf ./* ./.??* || true

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: '5.x'

      - name: Determine version with GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1.1.1
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Tag repository
        run: |
          git tag ${{ steps.gitversion.outputs.SemVer }}
          git push origin ${{ steps.gitversion.outputs.SemVer }}

      - name: Update package version
        uses: vers-one/dotnet-project-version-updater@v1.6
        with:
          file: "./meilisearch.NET/meilisearch.NET.csproj"
          version: ${{ steps.gitversion.outputs.SemVer }}

      - name: Build and package
        run: |
          dotnet build --configuration Release
          dotnet pack ./meilisearch.NET/meilisearch.NET.csproj --output nuget-packages --configuration Release -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Publish package to GitHub Packages
        run: |
          dotnet nuget push nuget-packages/*.nupkg \
            --skip-duplicate \
            --no-symbols \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }}
        # Uses the built-in GITHUB_TOKEN (job has packages: write). GitHub
        # Packages doesn't accept .snupkg symbol packages, so --no-symbols.

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.gitversion.outputs.SemVer }}
          name: Release ${{ steps.gitversion.outputs.SemVer }}
          body: |
            Automated release of meilisearch.NET ${{ steps.gitversion.outputs.SemVer }}.
            Package: https://github.com/${{ github.repository }}/packages
          files: nuget-packages/*.nupkg
          draft: false
          prerelease: false
